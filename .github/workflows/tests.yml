name: tests
on: [push, pull_request]
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"  # same uv as the Dockerfile; update both on purpose
      - run: uv sync --locked
      - run: make validate-gates
