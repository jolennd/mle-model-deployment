[project]
name = "mle-model-deployment-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "click>=8.5.0",
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
    "duckdb==2.0.0",
    "fastapi>=0.141.1",
    "great-expectations>=1.23.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml==6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "skops>=0.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff==0.17.3",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: needs more than one component",
  "dbserver: needs the database server up",
  "docker: needs Docker",
  "model: model quality tests",
  "data: data quality tests",
  "behavioral: behavioral cases and prediction sanity checks (needs the saved model)",
  "cli: runs the command-line interface in-process",
  "deploy: needs a deployed target",
  "transform: data rule checks on the built tables (needs the built database)",
  "reference: compares results with recorded reference numbers (needs the built database)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_duration"]
